name: CI Deploy (consulting-web - Test/Prod with Rollback)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - test
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout correct branch
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.environment == 'prod' && 'main' || 'test' }}

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build app
      - name: Build application
        run: npm run build

      # Prepare deploy package
      - name: Prepare deploy files
        run: |
          rm -rf deploy
          mkdir deploy
          cp -r .next deploy/
          cp -r public deploy/
          cp package.json deploy/
          cp next.config.* deploy/

      # Copy entire folderto ec2 (NOT deploy/*)
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ github.event.inputs.environment == 'prod' && secrets.EC2_HOST_PROD || secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ github.event.inputs.environment == 'prod' && secrets.EC2_SSH_KEY_PROD || secrets.EC2_SSH_KEY }}
          source: "deploy"
          target: "/var/www/frontend"

      # Deploy + rollback
      - name: Deploy and restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.event.inputs.environment == 'prod' && secrets.EC2_HOST_PROD || secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ github.event.inputs.environment == 'prod' && secrets.EC2_SSH_KEY_PROD || secrets.EC2_SSH_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20

            cd /var/www/frontend

            APP_DIR="consulting-web"
            NEW_DIR="deploy"
            BACKUP_DIR="consulting-web-backup"

            echo "Checking new build..."
            if [ ! -f "$NEW_DIR/package.json" ]; then
              echo "ERROR: package.json missing in deploy!"
              ls -la $NEW_DIR
              exit 1
            fi

            echo "Cleaning old backup..."
            rm -rf $BACKUP_DIR

            echo "Backing up current version..."
            if [ -d "$APP_DIR" ]; then
              mv $APP_DIR $BACKUP_DIR
            fi

            echo "Deploying new version..."
            mv $NEW_DIR $APP_DIR

            cd $APP_DIR

            echo "Loading environment variables..."
            set -a
            source /var/www/shared/consulting-web.env
            set +a

            echo "Installing production dependencies..."
            npm install --omit=dev

            echo "Restarting PM2..."

            # Load nvm properly
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            nvm use 20

            # Get exact node path
            NODE_PATH=$(dirname $(which node))

            echo "Node path: $NODE_PATH"
            echo "PM2 path: $NODE_PATH/pm2"

            # Use absolute pm2 path (fixes PATH issue completely)
            $NODE_PATH/pm2 reload consulting-web || $NODE_PATH/pm2 start npm --name "consulting-web" -- start

            $NODE_PATH/pm2 save

            echo "Deployment completed successfully!"