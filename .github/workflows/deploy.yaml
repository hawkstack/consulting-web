name: CI Deploy (Test/Prod with Rollback)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - test
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      # 1. Set branch
      - name: Set branch
        run: |
          if [ "${{ github.event.inputs.environment }}" == "prod" ]; then
            echo "BRANCH=main" >> $GITHUB_ENV
          else
            echo "BRANCH=test" >> $GITHUB_ENV
          fi

      # 2. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ env.BRANCH }}

      # 3. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 4. Install deps
      - name: Install dependencies
        run: npm ci

      # 5. Generate version file
      - name: Generate version file
        run: |
          mkdir -p public

          VERSION="0.1.${{ github.run_number }}"
          echo "NEXT_PUBLIC_APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_DEPLOY_RUN_ID=${{ github.run_id }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_DEPLOY_COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

          cat > public/version.json << EOF
          {
            "version": "$VERSION",
            "runId": "${{ github.run_id }}",
            "commit": "${{ github.sha }}"
          }
          EOF

          echo "Generated version file:"
          cat public/version.json

      # 6. Build
      - name: Build application
        run: npm run build

      # 7. Prepare deploy package
      - name: Prepare deploy files
        run: |
          rm -rf deploy
          mkdir deploy
          cp -r .next deploy/
          cp -r public deploy/
          cp package.json deploy/
          cp package-lock.json deploy/

      # 8. Copy to EC2
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/*"
          target: "/var/www/frontend/consulting-web-ci-new"
          rm: true

      # 9. Deploy + rollback
      - name: Deploy and restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20

            echo "Node version: $(node -v)"

            cd /var/www/frontend

            APP_DIR="consulting-web-ci"
            NEW_DIR="consulting-web-ci-new"
            BACKUP_DIR="consulting-web-ci-backup"

            if [ ! -d "$NEW_DIR" ]; then
              echo "ERROR: New build not found!"
              exit 1
            fi

            echo "Cleaning old backup..."
            rm -rf $BACKUP_DIR

            echo "Backing up current version..."
            if [ -d "$APP_DIR" ]; then
              mv $APP_DIR $BACKUP_DIR
            fi

            echo "Deploying new version..."
            mv $NEW_DIR $APP_DIR

            cd $APP_DIR

            if [ ! -f ".env" ]; then
              echo "WARNING: .env file missing!"
            fi

            echo "Installing production dependencies..."
            npm ci --omit=dev

            # Ensure pm2 is available
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "pm2 not found, installing globally..."
              npm install -g pm2
            fi

            # If .env missing, try to restore from previous backup (if present)
            if [ ! -f ".env" ]; then
              if [ -f "../$BACKUP_DIR/.env" ]; then
                echo "Restoring .env from backup..."
                cp ../$BACKUP_DIR/.env .env
              else
                echo "WARNING: .env file missing!" >&2
              fi
            fi

            echo "Restarting PM2 (reload, else start with proper args)..."

            # Use --update-env to make pm2 reload pick up environment changes.
            # If reload fails (process not present), start using npm so arguments are passed correctly.
            pm2 reload consulting-web-ci --update-env || pm2 start npm --name "consulting-web-ci" -- start -- -p 3001

            pm2 save

            echo "Deployment completed successfully!"